<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wumpus World Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>Wumpus World Agent</h1>
    </header>
    <div class="main-content">
      <div class="controls">
        <div class="card">
          <h3>Settings</h3>
          <p>Rows: <input type="number" id="inp-rows" value="5" min="2" max="8" /></p>
          <p>Cols: <input type="number" id="inp-cols" value="5" min="2" max="8" /></p>
          <button id="btn-start" onclick="startGame()">Start</button>
          <button id="btn-next" onclick="nextMove()" disabled>Next</button>
          <button onclick="resetGame()">Reset</button>
        </div>
        <div class="card">
          <h3>Metrics</h3>
          <div id="status-badge" class="status-badge">IDLE</div>
          <p>Pos: <span id="m-pos">—</span></p>
          <p>Steps: <span id="m-steps">0</span></p>
          <p>Visited: <span id="m-visited">0</span></p>
          <p>Safe: <span id="m-safe">0</span></p>
          <p>Percepts: <span id="m-percept">—</span></p>
        </div>
      </div>
      <div class="view">
        <div class="card">
          <h3>Grid View</h3>
          <div id="grid-container">
            <p>Start to see grid</p>
          </div>
        </div>
        <div class="card">
          <h3>Logs</h3>
          <div id="log-feed">
            <div>Offline</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>

</html>
